[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gagp-tools"
version = "0.1.0"
description = "Operational tools for GAGP program synthesis workflows"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gagp-tools = "gagp_tools.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gagp_tools*"]
